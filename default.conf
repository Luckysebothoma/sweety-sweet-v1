server {
  listen 80;

    server_name localhost;

    # Serve Angular App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
 

    # Proxy WebSocket connections
    location /ng-cli-ws {
        proxy_pass http://localhost/localhost:3050/ng-cli-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API requests
    location /api/v1/student {
        proxy_pass http://sweety-api-container:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}


events {
    worker_connections 1024;
}

http {
    ## Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name sweety.justdo-it.uk;
        return 301 https://sweety.justdo-it.uk$request_uri;
    }

    ## Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name loadbalancer.justdo-it.uk;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Common proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

 

            # Serve Angular App
        location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

        ## SWEETY Stack
#        location /sweety-gui/     { proxy_pass http://sweety-app:80/; }
#        location /sweety-api/     { proxy_pass http://sweety-api:80/; }
#        location /sweety-api/secure/ { proxy_pass http://sweety-api:443/; }


    # Proxy API requests
        location /api/v1/student {
        proxy_pass http://sweety-api-container:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


        ## Monitoring
#        location /grafana/        { proxy_pass http://grafana:3000/; }
#        location /prometheus/     { proxy_pass http://prometheus:9090/; }

        location /nginx_status {
            stub_status;
            access_log off;
            allow all;
        }

        ## GROQ Services
        location /groq-api/       { proxy_pass http://groq_hono_api-container:3000/; }
        location /groq-gui/       { proxy_pass https://angular-groq-worker.lucky-sebothoma-3.workers.dev/; }

        ## TTS
        location /opentts-api/    { proxy_pass http://tts-nginx-lb:80/; }
    }
}

