  <div class="table-scroll-container mat-table-container">
<mat-card-header>
    <mat-card-title>Product List</mat-card-title>
     <!-- Paginator -->
     <mat-paginator #paginatorProductList
      [pageSizeOptions]="[3, 7, 10, 15]"
       showFirstLastButtons></mat-paginator>

       <button mat-icon-button color="primary" (click)="loadTableData()">
  <mat-icon>refresh</mat-icon>
</button>

</mat-card-header>

<ng-container *ngIf="dataSourceProductList.data.length > 0">
    <table mat-table [dataSource]="dataSourceProductList" class="mat-elevation-z8">
      <!-- Product ID Column -->
      
      <ng-container matColumnDef="productId">
        <th mat-header-cell *matHeaderCellDef> Product ID </th>
        <td mat-cell *matCellDef="let element"> {{element.productId}} </td>
      </ng-container>

            <!-- Product Name Column -->
      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef> Product Name </th>
        <td mat-cell *matCellDef="let element; let i = index">
          <ng-container *ngIf="editRow === i; else staticName">
            <input matInput [(ngModel)]="editableRow.productName">
          </ng-container>
          <ng-template #staticName>{{ element.productName }}</ng-template>
        </td>
      </ng-container>

  
      <!-- Product Flavor Column -->
      <ng-container matColumnDef="productFlavor">
        <th mat-header-cell *matHeaderCellDef> Product Flavor </th>
        <td mat-cell *matCellDef="let element; let i = index">
          <ng-container *ngIf="editRow === i; else staticFlavor">
            <input matInput [(ngModel)]="editableRow.productFlavor">
          </ng-container>
          <ng-template #staticFlavor>{{ element.productFlavor }}</ng-template>
        </td>
      </ng-container>
  
      <!-- Product Price Column -->
      <ng-container matColumnDef="productPrice">
        <th mat-header-cell *matHeaderCellDef> Product Price </th>
        <td mat-cell *matCellDef="let element; let i = index">
          <ng-container *ngIf="editRow === i; else staticPrice">
            <input matInput type="number" [(ngModel)]="editableRow.productPrice">
          </ng-container>
          <ng-template #staticPrice>{{ element.productPrice }}</ng-template>
        </td>
      </ng-container>
        <!-- Image URL Column -->
      <ng-container matColumnDef="image_url">
        <th mat-header-cell *matHeaderCellDef> Image </th>
        <td mat-cell *matCellDef="let element">
          <img [src]="imageService.getImageUrl_nginx(element.productId)" style="max-width: 100px;" alt="Product image">
        </td>
      </ng-container>

          <!-- Action Buttons -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
    <mat-cell *matCellDef="let element; let i = index">
      <button mat-icon-button color="primary" *ngIf="editRow !== i" (click)="startEdit(i, element)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="accent" *ngIf="editRow === i" (click)="saveEdit(i, element)">
        <mat-icon>save</mat-icon>
      </button>
      <button mat-icon-button color="warn" *ngIf="editRow === i" (click)="cancelEdit()">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-cell>
  </ng-container>
  
      <!-- Table Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumnsProductList"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumnsProductList;"></tr>
    </table>
    
   </ng-container>

</div>

  <div *ngIf="dataSourceProductList.data.length === 0" class="no-data">
    No data available
  </div>
