  <div class="table-scroll-container mat-table-container">

<mat-card-header>
<h1>Estimates Report </h1>
</mat-card-header>

<mat-paginator
 [pageSize]="3" 
 [pageSizeOptions]="[5, 10, 20]"></mat-paginator>

 <button mat-icon-button color="primary" (click)="loadTableData()">
  <mat-icon>refresh</mat-icon>
</button>

<mat-table [dataSource]="dataSource" class="mat-elevation-z8">

          <!-- Product ID Column -->

    <ng-container matColumnDef="productId">
      <mat-header-cell *matHeaderCellDef> Product ID </mat-header-cell>
      <mat-cell *matCellDef="let element">
        {{ element.productId }}
        <img [src]="imageService.getImageUrl_nginx(element.productId)" style="max-width: 100px; margin-left: 10px;" alt="Product image">
      </mat-cell>
    </ng-container>
  
    <ng-container matColumnDef="estimatedSelling">
      <mat-header-cell *matHeaderCellDef> Estimated Selling </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.estimatedSelling }} </mat-cell>
    </ng-container>
  
    <ng-container matColumnDef="actualSelling">
      <mat-header-cell *matHeaderCellDef> Actual Selling </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.actualSelling }} </mat-cell>
    </ng-container>
  
    <ng-container matColumnDef="lastUpdated">
      <mat-header-cell *matHeaderCellDef> Last Updated </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.lastUpdated }} </mat-cell>
    </ng-container>
  
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
  
</div>
