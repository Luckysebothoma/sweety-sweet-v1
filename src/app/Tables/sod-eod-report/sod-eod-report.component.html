<div class="sod-eod-report-container">
  <h2>SOD/EOD RepoKLKrt</h2>
  
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      
      <!-- Product ID Column -->
      <ng-container matColumnDef="productId">
        <th mat-header-cell *matHeaderCellDef>Product ID</th>
        <td mat-cell *matCellDef="let element">{{element.productId}}
          <img [src]="imageService.getImageUrl_nginx(element.productId)" style="max-width: 100px; margin-left: 10px;" alt="Product image"
        (error)="onImageError($event)"
        >
        </td>
      </ng-container>

      <!-- Product Name Column -->
      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef>Product Name</th>
        <td mat-cell *matCellDef="let element">{{element.productName}}</td>
      </ng-container>

      <!-- Items Taken Column -->
      <ng-container matColumnDef="itemsTaken">
        <th mat-header-cell *matHeaderCellDef>Items Taken</th>
        <td mat-cell *matCellDef="let element">{{element.itemsTaken}}</td>
      </ng-container>

      <!-- Items Remaining Column -->
      <ng-container matColumnDef="itemsRemaining">
        <th mat-header-cell *matHeaderCellDef>Items Remaining</th>
        <td mat-cell *matCellDef="let element">{{element.itemsRemaining}}</td>
      </ng-container>

      <!-- Last Updated Column -->
      <ng-container matColumnDef="lastUpdated">
        <th mat-header-cell *matHeaderCellDef>Last Updated</th>
        <td mat-cell *matCellDef="let element">{{element.lastUpdated | date:'short'}}</td>
      </ng-container>

      <!-- Actions Column (if using displayedColumnsS) -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="editItem(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteItem(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Paginator -->
    <mat-paginator 
      #paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      aria-label="Select page of SOD/EOD items">
    </mat-paginator>
    <button mat-icon-button color="primary" (click)="loadTableData()">
  <mat-icon>refresh</mat-icon>
</button>

  </div>
</div>
