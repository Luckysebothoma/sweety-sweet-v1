<div class="edit-image-compare" style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">
  <figure style="margin:0;">
    <figcaption><strong>Current image</strong></figcaption>
    <app-image-viewer [productId]="productId" alt="Current product image"></app-image-viewer>
  </figure>

  <figure style="margin:0;" *ngIf="pendingUrl">
    <figcaption><strong>New image (will upload on Apply)</strong></figcaption>
    <img [src]="pendingUrl" alt="New product image preview" style="max-width:120px; max-height:120px;" />
  </figure>
</div>
