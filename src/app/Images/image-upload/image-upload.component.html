<div class="image-upload-container">
  <label class="image-upload-label">{{ label }}</label>
  <div class="file-selection">
    <input #fileInput type="file" accept="image/jpeg,image/png,image/webp"
           (change)="onFileChange($event)" />
  </div>

  <div class="image-preview" *ngIf="previewUrl && file">
    <img [src]="previewUrl" alt="Selected image preview"
         style="max-width: 160px; max-height: 160px; display: block; margin: 8px 0;" />
    <p><strong>{{ file.name }}</strong> ({{ sizeKb }} KB)</p>
    <button type="button" (click)="clear(fileInput)">Remove image</button>
  </div>

  <p class="image-error" role="alert" *ngIf="error" style="color: #b00020;">{{ error }}</p>
</div>
