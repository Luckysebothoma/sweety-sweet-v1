<div class="app_wrapper">
  <div class="container-fluid p-0">
    <mat-toolbar color="primary" class="flex-wrap justify-content-between">

      <mat-toolbar-row class="w-100 d-flex flex-wrap justify-content-between align-items-center">

        <!-- Navigation Links -->
        <div class="d-flex flex-wrap gap-2">
          <button mat-button routerLink="/products">Products</button>
          <button mat-button routerLink="/cart">Cart</button>

          <ng-container *ngIf="auth.isAuthenticated$ | async">
            <button mat-button routerLink="/capture">Capture</button>
          </ng-container>

                  <!-- Login/Logout -->
        <div class="d-flex gap-2 mt-2 mt-lg-0">
          <button
            mat-raised-button
            color="accent"
            (click)="authLogin()"
            *ngIf="!(auth.isAuthenticated$ | async)"
          >
            Log In
          </button>

          <button
            mat-raised-button
            color="warn"
            (click)="auth.logout()"
            *ngIf="auth.isAuthenticated$ | async"
          >
            Log Out
          </button>
        </div>

        </div>


      </mat-toolbar-row>
    </mat-toolbar>
  </div>
</div>

<!-- Page Content -->
<div class="container mt-3">
  <router-outlet></router-outlet>
</div>
