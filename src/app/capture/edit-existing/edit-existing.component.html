<mat-card class="p-4" [formGroup]="editForm">
  <mat-card-title>Edit Product</mat-card-title>
  <mat-card-content>
    <form [formGroup]="editForm" (ngSubmit)="applyChanges()">
      <div class="mat-form-grid">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Enter ID</mat-label>
          <input matInput formControlName="id" type="number" placeholder="ID" >
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Item Name</mat-label>
          <input matInput formControlName="name" type="text" placeholder="Item Name">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Item Flavor</mat-label>
          <input matInput formControlName="flavor" type="text" placeholder="Flavor">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Quantity</mat-label>
          <input matInput formControlName="quantity" type="number" placeholder="Quantity">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Item Size</mat-label>
          <input matInput formControlName="size" type="text" placeholder="Size">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Cost Price</mat-label>
          <input matInput formControlName="CostPrice" type="number" placeholder="Cost Price">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Selling Price</mat-label>
          <input matInput formControlName="sellingPrice" type="number" placeholder="Selling Price">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Item Group</mat-label>
          <input matInput formControlName="itemGroup" type="text" placeholder="Group">
        </mat-form-field>

      </div>

      <app-edit-image-viewer></app-edit-image-viewer>

      <!-- Action Buttons -->
      <div class="button-row">
        <button mat-raised-button color="primary" type="submit">
          Apply Changes to Product {{ editForm.get('id')?.value }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
