global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option  redispatch
    retries 3

frontend http_front
    bind *:80
    mode http
    option httplog

backend app_servers
    balance roundrobin
    option httpchk GET /
    server nginx1   sweety-app:80 check
    server apache1  sweety-apache:80 check
    server tomcat1  sweety-tomcat:8080 check
    server wildfly1 sweety-wildfly:8080 check
