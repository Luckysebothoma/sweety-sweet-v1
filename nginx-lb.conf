user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr status: $upstream_status '
                    'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream health checks and load balancing
    upstream sweety_web_backends {
        least_conn;  # Least connections load balancing
        
        # Web servers (nginx and apache)
        server app-server:80 max_fails=3 fail_timeout=30s;
        server app-server:80 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    upstream sweety_app_backends {
        least_conn;
        
        # Application servers (tomcat and wildfly)
        server app-server:8080 max_fails=3 fail_timeout=30s;
        server app-server:8080 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Load balancer status page
        location /lb-status {
            access_log off;
            return 200 "Load Balancer Active\nUpstreams: sweety_web_backends, sweety_app_backends\n";
            add_header Content-Type text/plain;
        }

        # Web traffic - round robin between nginx and apache
        location / {
            proxy_pass http://sweety_web_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Health check on proxy
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Application traffic - round robin between tomcat and wildfly
        location /app/ {
            proxy_pass http://sweety_app_backends/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }

    # Admin/Stats Server on port 8080
    server {
        listen 8080;
        server_name _;

        location / {
            return 200 "Sweety Load Balancer Stats\n\nWeb Backends: sweety-app:80, sweety-apache:80\nApp Backends: sweety-tomcat:8080, sweety-wildfly:8080\n\nHealth Check: http://YOUR_IP/health\nLB Status: http://YOUR_IP/lb-status\n";
            add_header Content-Type text/plain;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS Server (optional - uncomment when SSL certs are ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
