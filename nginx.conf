server {
    listen 80;
    server_name localhost;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sweety.justdo-it.uk;

    root /usr/share/nginx/html;
    index index.html;

    # SSL certs (use volumes or secrets in prod)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Gzip for performance
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml+rss;

    # Handle Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.html;
    }
}
